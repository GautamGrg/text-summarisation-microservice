name: Continuous Integration and Delivery pipeline (CI/CD)

on: 
  push:
    branches:
      - main

jobs:
    build:
        name: Build Docker Image
        runs-on: ubuntu-latest
        permissions:
          contents: read
          packages: write
        steps:
          - name: Set image name
            run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/summarisation-microservice" >> "$GITHUB_ENV"
          - name: Checkout code
            uses: actions/checkout@v7
            with: 
              ref: main
          - name: Login to GitHub Packages
            run: echo ${GITHUB_TOKEN} | docker login -u ${GITHUB_ACTOR} --password-stdin ghcr.io
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          - name: Pull image
            run: | 
              docker pull "$IMAGE:latest" || true
          - name: Build image
            run: |
              docker build \
                  --cache-from "$IMAGE:latest" \
                  --tag "$IMAGE:latest" \
                  --file ./project/Dockerfile.prod \
                  "./project"
          - name: Push image
            run: |
              docker push "$IMAGE:latest"
    
    test: 
      name: Test Docker Image
      runs-on: ubuntu-latest
      needs: build
      steps:
        - name: Set image name
          run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/summarisation-microservice" >> "$GITHUB_ENV"
        - name: Checkout code
          uses: actions/checkout@v7
          with:
            ref: main
        - name: Login to GitHub Packages
          run: echo ${GITHUB_TOKEN} | docker login -u ${GITHUB_ACTOR} --password-stdin ghcr.io
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        - name: Pull image
          run: |
            docker pull "$IMAGE:latest" || true
        - name: Build image
          run: |
            docker build \
                --cache-from "$IMAGE:latest" \
                --tag "$IMAGE:latest" \
                --file ./project/Dockerfile.prod \
                "./project"
        - name: Run container
          run: |
            docker run \
                -d \
                --name text-summarisation-microservice \
                -e PORT=8765 \
                -e ENVIRONMENT=dev \
                -e DATABASE_URL=sqlite://sqlite.db \
                -e DATABASE_TEST_URL=sqlite://sqlite.db \
                -p 5003:8765 \
                "$IMAGE:latest"
        - name: Pytest
          run: docker exec text-summarisation-microservice python -m pytest
        - name: Flake8
          run: docker exec text-summarisation-microservice python -m flake8
        - name: Black
          run: docker exec text-summarisation-microservice python -m black . --check
        - name: Isort
          run: docker exec text-summarisation-microservice python -m isort . --check

    deploy:
      name: Deploy to Vercel
      runs-on: ubuntu-latest
      needs: [build, test]
      env:
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID}}
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      steps:
        - name: Checkout
          uses: actions/checkout@v4
        - name: Install Vercel CLI
          run: npm install --global vercel@latest
        - name: Pull vercel Environment information
          run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        - name: Build Project Artifacts
          run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        - name: Deploy Project Artifacts to Vercel
          run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
